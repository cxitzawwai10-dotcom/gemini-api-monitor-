name: Android Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, v1.0.6-compact-ui]

permissions:
  contents: read

concurrency:
  group: android-signed-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build and verify signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Do not build or upload a debug APK."
              exit 1
            fi
          done

      - name: Install dependencies
        env:
          CI: "false"
        run: bun install --no-save

      - name: Build web app
        run: bun run build

      - name: Add and sync Android
        run: |
          bunx cap add android
          bunx cap sync android

      - name: Configure release signing and version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: "1.0.6"
          APP_VERSION_CODE: "10006"
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()
          version = os.environ["APP_VERSION"]
          code = os.environ["APP_VERSION_CODE"]

          s, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {code}', s, count=1)
          s, n2 = re.subn(r'versionName\s+["\'][^"\']+["\']', f'versionName "{version}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely set Android versionCode/versionName")

          signing = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_STORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in s:
              s, inserted = re.subn(r'(?m)^(\s*)buildTypes\s*\{', signing + r'\n\1buildTypes {', s, count=1)
              if inserted != 1:
                  raise SystemExit("Could not insert release signing configuration")

          pattern = r'(?s)(buildTypes\s*\{.*?\brelease\s*\{)'
          if "signingConfig signingConfigs.release" not in s:
              s, attached = re.subn(pattern, r'\1\n            signingConfig signingConfigs.release', s, count=1)
              if attached != 1:
                  raise SystemExit("Could not attach signing config to buildTypes.release")

          p.write_text(s)
          print(f"Configured signed release {version} (versionCode {code})")
          PY

      - name: Build release APK (never debug)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-keystore.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature and package
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Verified signed release APK: $APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: gemini-api-monitor-v1.0.6-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
