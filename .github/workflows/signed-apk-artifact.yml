name: Signed APK Artifact (v1.0.6-dev)

on:
  workflow_dispatch:
  push:
    branches: [v1.0.6-dev]
    paths:
      - '.github/workflows/signed-apk-artifact.yml'
      - 'src/**'
      - 'package.json'
      - 'bun.lock*'
      - 'vite.config.*'
      - 'index.html'

permissions:
  contents: read

concurrency:
  group: signed-apk-v106
  cancel-in-progress: false

jobs:
  build:
    name: Build signed v1.0.6 APK artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout v1.0.6-dev
        uses: actions/checkout@v4
        with:
          ref: v1.0.6-dev

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies
        env:
          CI: "false"
        run: bun install --no-save

      - name: Build web app
        run: bun run build

      - name: Add and sync Android
        run: |
          bunx cap add android
          bunx cap sync android

      - name: Configure release signing and version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/release-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          s, n1 = re.subn(r'versionCode\s+\d+', 'versionCode 6', s, count=1)
          s, n2 = re.subn(r"versionName\s+['\"][^'\"]+['\"]", 'versionName "1.0.6"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely set versionCode 6 / versionName 1.0.6")

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_STORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in s:
              s, n = re.subn(r'(?m)^(\s*)buildTypes\s*\{', signing + r'\n\1buildTypes {', s, count=1)
              if n != 1:
                  raise SystemExit("Could not insert release signing configuration")
          if "signingConfig signingConfigs.release" not in s:
              s, n = re.subn(r'(?s)(buildTypes\\s*\\{.*?\\brelease\\s*\\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
              if n != 1:
                  raise SystemExit("Could not attach release signing configuration")
          p.write_text(s)
          print("Configured signed Android release v1.0.6 (versionCode 6)")
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature and package metadata
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/$(basename "$(dirname "$APKSIGNER")")/aapt" dump badging "$APK" | grep -E "package: name='com.geminipulse.monitor' versionCode='6' versionName='1.0.6'"
          "$APKSIGNER" verify --print-certs "$APK" | tee signing-certificate.txt
          echo "Signed v1.0.6 APK verified."

      - name: Upload signed APK only (no GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: gemini-api-monitor-v1.0.6-signed-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            signing-certificate.txt
          if-no-files-found: error
          retention-days: 90
