name: Signed Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies
        env:
          CI: "false"
        run: bun install --no-save

      - name: Build web app
        run: bun run build

      - name: Add and sync Android
        run: |
          bunx cap add android
          bunx cap sync android

      - name: Configure signed release build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$GITHUB_WORKSPACE/android/app/release-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          python3 - <<'PY'
          import os, re
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()
          version = os.environ["APP_VERSION"].removeprefix("v")
          code = os.environ["APP_VERSION_CODE"]

          s, n1 = re.subn(r'versionCode\s+\d+', f'versionCode {code}', s, count=1)
          s, n2 = re.subn(r'versionName\s+["\'][^"\']+["\']', f'versionName "{version}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not safely update Android versionCode/versionName")

          signing = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_STORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" not in s:
              s, ns = re.subn(r'(?m)^(\s*)buildTypes\s*\{', signing + r'\n\1buildTypes {', s, count=1)
              if ns != 1:
                  raise SystemExit("Could not insert release signing configuration")

          # Attach signing only to buildTypes.release, not signingConfigs.release.
          pattern = r'(?s)(buildTypes\s*\{.*?\brelease\s*\{)'
          if "signingConfig signingConfigs.release" not in s:
              s, n3 = re.subn(pattern, r'\1\n            signingConfig signingConfigs.release', s, count=1)
              if n3 != 1:
                  raise SystemExit("Could not safely attach signing config to buildTypes.release")

          p.write_text(s)
          print(f"Prepared signed release {os.environ['APP_VERSION']} (versionCode {code})")
          PY

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-keystore.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK and signing certificate
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "Signed APK verified: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-api-monitor-${{ github.ref_name }}-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Gemini API Monitor ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
